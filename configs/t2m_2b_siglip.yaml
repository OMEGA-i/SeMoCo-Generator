# SeMoCo-Generator — 1.70B Text2Motion (Flan-T5 + Qwen3TTS-aligned).
# Qwen3TTS-aligned: head_dim=128, GQA 2:1, code_pred=1024, rope_theta=1M.
# 2048→1024 bridge projection — closest match to Qwen3TTS 1.7B.
# d_model=2048, n_heads=16, n_kv_heads=8 — identical to Qwen3TTS 1.7B talker.

data:
  codes_root: local://t2m_codes
  train_split: train
  val_split: val
  max_motion_tok: 300

text:
  encode: siglip
  text_max_length: 64
  cfg_prob: 0.1

model:
  d_model: 2048
  n_layers: 34
  n_heads: 16                    # head_dim = 2048/16 = 128 (matches Qwen3TTS 1.7B)
  n_kv_heads: 8                  # GQA 2:1 (matches Qwen3TTS 1.7B)
  ffn_hidden: 5461
  rope_theta: 1000000.0
  dropout: 0.0
  max_seq_len: 4096
  code_pred_hidden: 1024         # fixed, 2048→1024 bridge (matches Qwen3TTS 1.7B)
  code_pred_layers: 5            # matches Qwen3TTS
  code_pred_heads: 8
  code_pred_kv_heads: 4          # GQA 2:1
  code_pred_ffn_hidden: 3072     # fixed
  code_axis_loss_scale: 0.3
  code_axis_warmup_steps: 15000
  gradient_checkpointing: true
  eos_loss_scale: 1.0
  loss_weights: null

optim:
  lr: 8.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 12000
  grad_clip: 1.0

train:
  batch_size: 4
  grad_accum_steps: 8            # global batch 256
  max_steps: 100000
  precision: bf16
  num_workers: 4
  seed: 3407
  log_every: 50
  val_every: 1000
  ckpt_every: 5000
  out_dir: runs/t2m_2b_siglip

swanlab:
  enabled: false
  project: SeMoCo-Generator
  experiment_name: t2m_2b_siglip
